version = 1

# Code is LGPL-3.0-only, the suite's own prose and content are CC BY 4.0, and whatever is not the
# suite's own keeps the licence it came with (ADR-0001). Java files carry their own SPDX headers;
# this file marks everything that can't hold one. The last annotation matching a file wins, so the
# general rules come first and the exceptions after them.

# Code, and the files a program reads as instructions.
[[annotations]]
path = [
    "**/*.gradle",
    "**/gradle.properties",
    "mise.toml",
    ".gitignore",
    ".gitattributes",
    ".github/**",
    ".claude/hooks/**",
    ".claude/settings.json",
    "**/*.mods.toml",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "LGPL-3.0-only"

# The suite's own prose and content: the glossary, ADRs, docs and READMEs, and the Runtime's
# resources, its sprites among them.
[[annotations]]
path = [
    "**/*.md",
    "**/src/main/resources/**/*.json",
    "**/src/main/resources/**/*.png",
    "**/src/gametest/resources/**/*.json",
    "**/src/gametest/resources/**/*.mcmeta",
    "**/src/gametest/resources/**/*.nbt",
    "LICENSE",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "CC-BY-4.0"

# The agent skills, from mattpocock/skills.
[[annotations]]
path = [".agents/**", ".claude/skills", ".gitmodules"]
precedence = "override"
SPDX-FileCopyrightText = "Matt Pocock"
SPDX-License-Identifier = "MIT"

# The Gradle wrapper is Gradle's.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"

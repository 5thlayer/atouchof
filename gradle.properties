# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties. The build, the mods.toml and the scripts read the Runtime's names from here; the
# Java package, MOD_ID and settings.gradle spell mod_id too (ModIdTest checks MOD_ID).
mod_id = atouchof
mod_name = A Touch Of
mod_description = The small mod every A Touch Of Pillar nests: it draws the Pillars' meters, and holds no mechanic.
mod_version = 0.1.0
maven_group = io.github.5thlayer
archives_name = atouchof

# Minecraft properties
minecraft_version = 26.1.2

# Dependencies
neoforge_version = 26.1.2.77

# Modrinth and CurseForge (docs/agents/releases.md). The Runtime reaches players only nested in a
# Pillar, so it names no project and the release task skips the upload.
modrinth_project_id =
curseforge_project_id =
modrinth_dependencies =
curseforge_dependencies =
upload_release_type =
